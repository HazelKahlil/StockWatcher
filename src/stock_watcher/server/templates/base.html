<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}StockWatcher{% endblock %}</title>
<link rel="icon" href="/static/favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="/static/app.css?v=12">
<meta name="color-scheme" content="light dark">
{% if user %}<meta name="csrf-token" content="{{ csrf }}">{% endif %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">StockWatcher</a>
  {% if user %}
  <nav aria-label="主导航">
    <a href="/">当前观察</a>
    <a href="/alerts">提醒中心</a>
    <a href="/history">历史</a>
    <a href="/outcomes">次日复盘</a>
    <a href="/summary">盘后总结</a>
    {% if user.role == 'admin' %}<a href="/admin">管理</a>{% endif %}
  </nav>
  <div class="account" aria-label="账户">
    <span class="account-item account-username">{{ user.username }}</span>
    <button id="logout-btn" type="button" class="account-item account-logout">退出</button>
  </div>
  {% endif %}
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
{% if user %}
<script type="module" src="/static/app.js?v=5"></script>
{% block scripts %}{% endblock %}
{% endif %}
</body>
</html>
