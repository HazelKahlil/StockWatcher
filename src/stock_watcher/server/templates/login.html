{% extends "base.html" %}
{% block title %}登录 · StockWatcher{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="login-title">
  <h1 id="login-title">StockWatcher 内部试用</h1>
  <p class="muted">仅限受邀测试者；凭据只经 HTTPS 提交。</p>
  <form id="login-form" method="post" action="/api/v1/auth/login" novalidate>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button type="submit">登录</button>
  </form>
</section>
<script type="module" src="/static/login.js?v=1"></script>
{% endblock %}
