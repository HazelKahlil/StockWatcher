services:
  web:
    volumes: !override
      - stockwatcher_tunnel_db:/var/lib/stockwatcher/db
      - stockwatcher_tunnel_reports:/var/lib/stockwatcher/reports
      - stockwatcher_tunnel_backups:/backups

  worker:
    volumes: !override
      - stockwatcher_tunnel_db:/var/lib/stockwatcher/db
      - stockwatcher_tunnel_reports:/var/lib/stockwatcher/reports
      - stockwatcher_tunnel_backups:/backups

  tunnel-gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    user: "10001:10001"
    environment:
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TUNNEL_ORIGIN_PORT:-18000}:8080"
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /data:rw,noexec,nosuid,size=16m
      - /config:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: unless-stopped
    depends_on:
      tunnel-gateway:
        condition: service_healthy
    user: "${TUNNEL_RUN_UID:?set TUNNEL_RUN_UID}:${TUNNEL_RUN_GID:?set TUNNEL_RUN_GID}"
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --no-autoupdate
      - --loglevel
      - info
      - run
      - --credentials-file
      - /etc/cloudflared/credentials.json
      - ${CLOUDFLARED_TUNNEL_ID:?set CLOUDFLARED_TUNNEL_ID}
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_FILE:?set CLOUDFLARED_CREDENTIALS_FILE}:/etc/cloudflared/credentials.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  stockwatcher_tunnel_db:
  stockwatcher_tunnel_reports:
  stockwatcher_tunnel_backups:
