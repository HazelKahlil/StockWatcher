name: stockwatcher

x-app-common: &app-common
  image: stockwatcher-web:${IMAGE_TAG:?set IMAGE_TAG in .env}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      UV_VERSION: ${UV_VERSION:-0.9.26}
      SOURCE_COMMIT: ${SOURCE_COMMIT:?set final source commit}
      BUILD_VERSION: ${BUILD_VERSION:?set build version}
  restart: unless-stopped
  init: true
  read_only: true
  user: "10001:10001"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    STOCKWATCHER_ENV: production
    STOCKWATCHER_DB_PATH: /var/lib/stockwatcher/db/stockwatcher.db
    STOCKWATCHER_REPORT_DIR: /var/lib/stockwatcher/reports
    STOCKWATCHER_BACKUP_DIR: /backups
    STOCKWATCHER_MASTER_KEY_FILE: /run/secrets/stockwatcher_master_key
    STOCKWATCHER_BUSINESS_TIMEZONE: Asia/Shanghai
    STOCKWATCHER_PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN}
    STOCKWATCHER_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    STOCKWATCHER_TRUSTED_HOSTS: ${DOMAIN:?set DOMAIN},localhost,127.0.0.1,web
    STOCKWATCHER_REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-1048576}
    STOCKWATCHER_SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
    STOCKWATCHER_SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
    STOCKWATCHER_LOGIN_HASH_CONCURRENCY: ${LOGIN_HASH_CONCURRENCY:-2}
    STOCKWATCHER_RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
    STOCKWATCHER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    STOCKWATCHER_SOURCE_COMMIT: ${SOURCE_COMMIT:?set final source commit}
    STOCKWATCHER_BUILD_VERSION: ${BUILD_VERSION:?set build version}
  secrets:
    - stockwatcher_master_key
  volumes:
    - ./state/db:/var/lib/stockwatcher/db
    - ./reports:/var/lib/stockwatcher/reports
    - ./backups:/backups
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  web:
    <<: *app-common
    command: ["python", "-m", "stock_watcher.server.web"]
    stop_grace_period: 120s
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    <<: *app-common
    command: ["python", "-m", "stock_watcher.server.worker"]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "-m", "stock_watcher.server.healthcheck", "worker"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

secrets:
  stockwatcher_master_key:
    file: ./secrets/stockwatcher_master_key

volumes:
  caddy_data:
  caddy_config:
