name: Governance

on:
  push:
    branches:
      - main
      - "publish/web-*"
  pull_request:

permissions:
  contents: read

jobs:
  web-security:
    name: Web security and runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen --python "3.12"
      - name: Run Web security, durability, and POSIX deployment regression suites
        run: >-
          uv run pytest tests/test_web_auth_api.py tests/test_web_ws.py
          tests/test_web_services.py tests/test_web_worker.py
          tests/test_web_healthcheck.py tests/test_storage_fsync.py
          tests/test_cnb_registry_snapshot.py -W error
      - name: Check Python, JavaScript, workspace, and security evidence
        run: |
          uv run ruff check .
          uv run mypy src tests
          python scripts/validate_workspace.py
          find src/stock_watcher/server/static -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/security/repo-secret-scan.json").read_text())
          if report.get("status") != "PASS" or report.get("confirmed_finding_count") != 0:
              raise SystemExit("repository secret scan evidence is not an unambiguous PASS")
          findings = report.get("findings", [])
          if report.get("raw_finding_count") != len(findings):
              raise SystemExit("repository secret scan finding count is inconsistent")
          for finding in findings:
              path = Path(finding["file"])
              line_number = int(finding["line"])
              lines = path.read_text(encoding="utf-8").splitlines()
              if not 1 <= line_number <= len(lines):
                  raise SystemExit(f"stale secret scan line: {path}:{line_number}")
              if finding["pattern"].casefold() not in lines[line_number - 1].casefold():
                  raise SystemExit(f"stale secret scan pattern: {path}:{line_number}")
          PY
      - name: Build the locked Web image
        run: |
          docker build \
            --build-arg UV_VERSION=0.9.26 \
            --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_VERSION=web-security-review \
            -f deploy/Dockerfile \
            -t stockwatcher-web:"${GITHUB_SHA}" .

  web-display-ui:
    name: Web display layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen --python "3.12"
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run display layout and dashboard UI tests
        env:
          STOCKWATCHER_REQUIRE_UI: "1"
        run: |
          node --test tests/test_ui_display.mjs
          uv run pytest tests/test_web_display_layout.py -W error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine dependency-review applicability from the actual PR diff
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import fnmatch
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          base = os.environ["PR_BASE_SHA"]
          head = os.environ["PR_HEAD_SHA"]
          ancestor = subprocess.check_output(
              ["git", "merge-base", base, head], text=True
          ).strip()
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", "-z", ancestor, head]
          ).decode("utf-8").split("\0")
          patterns = (
              "pyproject.toml", "uv.lock", "uv.toml", "requirements*.txt",
              "requirements*.in", "requirements*.json", "constraints*.txt",
              "constraints*.in", "setup.py", "setup.cfg", "Pipfile*", "poetry.lock",
              "pdm.lock", "pylock*.toml", "package*.json", "npm-shrinkwrap.json",
              "yarn.lock", "pnpm-lock.yaml", "bun.lock*", "Cargo.toml", "Cargo.lock",
              "go.mod", "go.sum", "Gemfile*", "*.gemspec", "composer.json",
              "composer.lock", "pom.xml", "build.gradle*", "gradle.lockfile",
              "libs.versions.toml", "*.csproj", "*.fsproj", "packages.config",
              "packages.lock.json", "Directory.Packages.props", "Dockerfile*",
              "*.dockerfile", "environment*.yml", "environment*.yaml", "conda-lock*",
              ".gitmodules", ".cnb.yml", "action.yml", "action.yaml",
          )
          needs_review = []
          for path in filter(None, paths):
              name = PurePosixPath(path).name
              if any(fnmatch.fnmatchcase(name, pattern) for pattern in patterns):
                  needs_review.append(path)
              elif path.startswith(".github/workflows/"):
                  def action_refs(revision):
                      listing = subprocess.check_output(
                          ["git", "ls-tree", "--name-only", revision, "--", path],
                          text=True,
                      )
                      if not listing.strip():
                          return set()
                      text = subprocess.check_output(
                          ["git", "show", f"{revision}:{path}"], text=True
                      )
                      return set(re.findall(
                          r"^\s*(?:-\s*)?uses:\s*([^\s#]+)", text, re.MULTILINE
                      ))
                  if action_refs(ancestor) != action_refs(head):
                      needs_review.append(path)
          required = bool(needs_review)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"required={str(required).lower()}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              if required:
                  summary.write("Dependency changes detected; external review must pass.\n")
                  summary.write("\n".join(f"- `{p}`" for p in needs_review) + "\n")
              else:
                  summary.write(
                      "No dependency manifest, lockfile, image declaration, or Action "
                      "reference changes in the PR diff. Dependency delta review is "
                      "not applicable. This does not certify existing dependencies "
                      "as vulnerability-free.\n"
                  )
          PY
      - uses: actions/dependency-review-action@v4
        if: steps.scope.outputs.required == 'true'

  workspace-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workspace baseline
        run: python scripts/validate_workspace.py
      - name: Check whitespace errors in the proposed change
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          else
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree" "$GITHUB_SHA"
          fi

  windows-no-terminal:
    name: Windows no-terminal / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen --python "${{ matrix.python-version }}"
      - name: Verify import, CLI, tests, lint, and types
        shell: pwsh
        run: |
          uv run python -c "import stock_watcher; import stock_watcher.providers.tdxquant; import stock_watcher.ui.app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -m stock_watcher --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PowerShell setup and fail-closed preflight
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\windows\stockwatcher.ps1 -Action Setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $terminalPath = Join-Path $env:RUNNER_TEMP "官方 终端目录"
          New-Item -ItemType Directory -Force -Path $terminalPath | Out-Null
          pwsh -NoProfile -File .\scripts\windows\stockwatcher.ps1 -Action Preflight -TdxInstallPath $terminalPath
          if ($LASTEXITCODE -eq 0) { throw "Preflight unexpectedly passed without TdxQuant" }
          $reportPath = Join-Path $env:LOCALAPPDATA "StockWatcher\reports\tdxquant-preflight.json"
          if (-not (Test-Path $reportPath)) { throw "Failed preflight did not write a report" }
          $report = Get-Content -Raw -Encoding UTF8 $reportPath | ConvertFrom-Json
          if ($report.status -ne "FAIL") { throw "Preflight report is not FAIL" }
          python scripts/check_windows_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build PyInstaller folder and Inno Setup installer
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\windows\stockwatcher.ps1 -Action Build
      - name: Upload no-terminal build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stockwatcher-windows-py${{ matrix.python-version }}
          path: |
            dist/StockWatcher-0.6.0-alpha.4-portable.zip
            dist/installer/*.exe
          if-no-files-found: error
          retention-days: 7
