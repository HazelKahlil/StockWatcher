name: Apply Windows desktop stability patch

on:
  push:
    branches: [fix/windows-desktop-stability]
    paths:
      - scripts/_patch_windows_ui.py
      - .github/workflows/apply-windows-desktop-stability.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-desktop-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Apply source patch
        run: python scripts/_patch_windows_ui.py
      - name: Refresh lock for alpha.5
        run: uv lock
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen
      - name: Run full offline test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
      - name: Run lint and strict types
        run: |
          uv run ruff check .
          uv run mypy src tests
      - name: Run governance and Windows package contracts
        run: |
          python scripts/validate_workspace.py
          uv run python scripts/check_windows_package.py
          python -m json.tool CURRENT_RELEASES.json > /dev/null
          git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Windows desktop lifecycle and UI"
          git push origin HEAD:fix/windows-desktop-stability
