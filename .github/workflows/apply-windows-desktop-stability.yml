name: Apply Windows desktop stability patch

on:
  push:
    branches: [fix/windows-desktop-stability]
    paths:
      - scripts/_patch_windows_ui.py
      - scripts/_patch_windows_ui_followup.py
      - .github/workflows/apply-windows-desktop-stability.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/_patch_windows_ui.py
      - scripts/_patch_windows_ui_followup.py
      - .github/workflows/apply-windows-desktop-stability.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-desktop-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Apply source patch when needed
        shell: pwsh
        run: |
          $isAlpha4 = Select-String -Path pyproject.toml -Pattern 'version = "0.6.0a4"' -Quiet
          if ($isAlpha4) {
            python scripts/_patch_windows_ui.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/_patch_windows_ui_followup.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            uv lock
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Patch is already applied at alpha.5; verification only."
          }
      - name: Commit materialized source patch
        shell: pwsh
        run: |
          # GITHUB_TOKEN cannot update workflow files. The connector updates the
          # normal Governance artifact version separately after source materializes.
          git restore .github/workflows/governance.yml
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated source changes to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Windows desktop lifecycle and UI"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/windows-desktop-stability
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen
      - name: Run first-failure regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -x -vv
      - name: Run lint and strict types
        run: |
          uv run ruff check src tests scripts/check_windows_package.py
          uv run mypy src tests
      - name: Run governance and Windows package contracts
        run: |
          python scripts/validate_workspace.py
          uv run python scripts/check_windows_package.py
          python -m json.tool CURRENT_RELEASES.json > $null
          git diff --check
