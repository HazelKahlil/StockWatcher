name: Repair alpha.5 Windows artifact contract test

on:
  push:
    branches: [fix/windows-desktop-stability]
    paths:
      - .github/workflows/fix-alpha5-contract.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-desktop-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Update the version-locked workflow assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_windows_package.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert "dist/StockWatcher-0.6.0-alpha.4-portable.zip" in workflow'
          new = 'assert "dist/StockWatcher-0.6.0-alpha.5-portable.zip" in workflow'
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale artifact assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Verify complete offline gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --all-groups --frozen
          uv run pytest
          uv run ruff check .
          uv run mypy src tests
          python scripts/validate_workspace.py
          uv run python scripts/check_windows_package.py
          python -m json.tool CURRENT_RELEASES.json > /dev/null
          git diff --check
      - name: Commit the verified fix and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-alpha5-contract.yml
          git add tests/test_windows_package.py
          git commit -m "test: align Windows artifact contract with alpha.5"
          git push origin HEAD:fix/windows-desktop-stability
