name: Apply Windows Python 3.11 Qt cleanup fix

on:
  push:
    branches: [fix/windows-desktop-stability]
    paths:
      - .github/workflows/fix-windows311-qt-test.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-desktop-stability
          fetch-depth: 0
      - name: Patch unsafe Qt test teardown and shortcut construction
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_macos_port.py")
          text = test_path.read_text(encoding="utf-8")
          old_signature = "def test_macos_lifecycle_external_quit_records_graceful_and_exits() -> None:\n"
          new_signature = (
              "def test_macos_lifecycle_external_quit_records_graceful_and_exits(\n"
              "    monkeypatch: pytest.MonkeyPatch,\n"
              ") -> None:\n"
          )
          if text.count(old_signature) != 1:
              raise SystemExit("unexpected external-quit test signature")
          text = text.replace(old_signature, new_signature)
          old_assignment = (
              "    lifecycle._app.quit = lambda: quit_calls.append(True)  # type: ignore[method-assign]\n"
          )
          new_assignment = (
              "    monkeypatch.setattr(lifecycle._app, \"quit\", lambda: quit_calls.append(True))\n"
          )
          if text.count(old_assignment) != 1:
              raise SystemExit("unexpected QApplication.quit assignment")
          text = text.replace(old_assignment, new_assignment)
          old_tail = (
              "    assert calls == [(\"shutdown\", \"apple_event_quit\")]\n"
              "    assert quit_calls == [True]\n"
              "    assert lifecycle._quitting\n\n\n"
              "def test_macos_close_event_programmatic_close_exits_not_hides(\n"
          )
          new_tail = (
              "    assert calls == [(\"shutdown\", \"apple_event_quit\")]\n"
              "    assert quit_calls == [True]\n"
              "    assert lifecycle._quitting\n"
              "    lifecycle.deleteLater()\n"
              "    app.processEvents()\n\n\n"
              "def test_macos_close_event_programmatic_close_exits_not_hides(\n"
          )
          if text.count(old_tail) != 1:
              raise SystemExit("unexpected external-quit test tail")
          test_path.write_text(text.replace(old_tail, new_tail), encoding="utf-8")

          window_path = Path("src/stock_watcher/ui/main_window.py")
          window = window_path.read_text(encoding="utf-8")
          old_shortcut = "            quit_action.setShortcut(QKeySequence.StandardKey.Quit)\n"
          new_shortcut = (
              "            quit_action.setShortcut(\n"
              "                QKeySequence(QKeySequence.StandardKey.Quit)\n"
              "            )\n"
          )
          if window.count(old_shortcut) != 1:
              raise SystemExit("unexpected Quit shortcut construction")
          window_path.write_text(window.replace(old_shortcut, new_shortcut), encoding="utf-8")
          PY
      - name: Commit the fix and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-windows311-qt-test.yml
          git add tests/test_macos_port.py src/stock_watcher/ui/main_window.py
          git commit -m "test: clean up Qt lifecycle safely on Windows Python 3.11"
          git push origin HEAD:fix/windows-desktop-stability
