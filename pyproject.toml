[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stock-watcher"
version = "0.2.0"
description = "Mac Mock/Replay Alpha UI for StockWatcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.0,<3",
    "PySide6>=6.8.0,<7",
    "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = ["mypy>=1.15.0", "pytest>=8.3.0", "ruff>=0.11.0", "types-PyYAML>=6.0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_watcher"]
