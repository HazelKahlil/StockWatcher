[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stock-watcher"
version = "0.4.0a1"
description = "A-share market scanner with stable real-time Top3 candidates (headless service + Web internal test)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2,<2.5",
    "pydantic>=2.11.0,<3",
    "PyYAML>=6.0.2,<7",
    "reportlab>=4.4.0,<5",
    "requests>=2.32,<3",
    "tushare>=1.4.29,<1.5",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
desktop-macos = [
    "keyring>=25,<26",
    "pyobjc-framework-cocoa>=12.2.1; sys_platform == 'darwin'",
    "PySide6>=6.8.0,<7",
]
server = [
    "argon2-cffi>=23.1,<25",
    "cryptography>=42,<46",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "stock-watcher[desktop-macos]",
    "stock-watcher[server]",
    "httpx>=0.27,<1",
    "mypy>=1.15.0",
    "playwright>=1.45,<2",
    "pyinstaller>=6.0.0,<7",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.11.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.32,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not live_tushare"'
markers = [
    "live_tushare: requires Human Owner-provided credentials and an explicit live run",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "argon2.*",
    "fastapi.*",
    "jinja2.*",
    "multipart.*",
    "starlette.*",
    "uvicorn.*",
    "websockets.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/stock_watcher"]
