<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史 · StockWatcher（模拟数据预览）</title>
<link rel="stylesheet" href="/src/stock_watcher/server/static/app.css">
<link rel="stylesheet" href="/src/stock_watcher/server/static/refinements.css">
<link rel="stylesheet" href="/src/stock_watcher/server/static/display.css?v=3">
<meta name="color-scheme" content="light">
<script src="/src/stock_watcher/server/static/display.js?v=3"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./preview-dashboard.html">StockWatcher</a>
  <nav aria-label="主导航">
    <a href="./preview-dashboard.html">当前观察</a>
    <a href="./preview-history.html" aria-current="page">历史</a>
    <a href="./preview-history.html">次日复盘</a>
  </nav>
  <div class="account-cluster">
    <div class="display-control" id="display-control">
      <button type="button" class="watch-exit" id="watch-exit" hidden>退出仅看三只</button>
      <button type="button" class="display-toggle" id="display-toggle" aria-expanded="false" aria-controls="display-panel" aria-haspopup="dialog">
        <span class="display-toggle-copy">
          <span class="display-toggle-label">显示大小</span>
          <span class="display-toggle-value" id="display-scale-label">100%</span>
        </span>
      </button>
      <div class="display-panel" id="display-panel" hidden role="dialog" aria-labelledby="display-panel-title" aria-describedby="display-panel-hint">
        <div class="display-panel-header">
          <h2 id="display-panel-title">显示大小</h2>
          <button type="button" class="display-panel-close" id="display-panel-close">关闭</button>
        </div>
        <div class="display-slider-row">
          <button type="button" class="display-step" data-display-step="-5" aria-label="缩小 5%">−</button>
          <label class="display-slider-label">
            <span class="visually-hidden">页面显示比例</span>
            <input id="display-scale" type="range" min="20" max="150" step="5" value="100">
          </label>
          <button type="button" class="display-step" data-display-step="5" aria-label="放大 5%">+</button>
          <span class="display-scale-readout" id="display-scale-readout" aria-live="polite">100%</span>
        </div>
        <div class="display-panel-actions">
          <button type="button" class="button-secondary" id="display-reset">恢复 100%</button>
          <button type="button" class="display-compact" id="display-compact" aria-pressed="false">仅看三只</button>
        </div>
        <p class="display-panel-hint" id="display-panel-hint">拖动即可即时调整。仅看三只会收起说明和复盘，只保留三只候选和必要状态。</p>
      </div>
    </div>
    <div class="account" aria-label="账户">
      <span class="account-item account-username">preview</span>
      <button id="logout-btn" type="button" class="account-item account-logout">退出</button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
<p class="preview-banner" style="margin:0 0 12px;padding:8px 12px;border-radius:8px;background:#fff7df;color:#7a5a00;font-size:12px;">模拟数据预览 · 历史页应保持完整内容</p>
<header class="page-heading"><div><p class="page-eyebrow">观察档案</p><h1>历史观察</h1><p class="muted">按日期或代码回看候选，保留每一轮的原始顺序。</p></div></header>
<form class="filters" aria-label="筛选历史观察">
  <label>开始日期 <input type="date" value="2026-09-01"></label>
  <label>结束日期 <input type="date" value="2026-09-10"></label>
  <button type="button">筛选</button>
</form>
<p class="list-status" role="status">已显示 2 条历史观察（模拟）。</p>
<div class="table-wrap">
  <table>
    <thead><tr><th>日期</th><th>排名</th><th>名称</th><th>代码</th></tr></thead>
    <tbody>
      <tr><td>2026-09-10</td><td>1</td><td>金丹科技</td><td>300829.SZ</td></tr>
      <tr><td>2026-09-10</td><td>2</td><td>华宝股份</td><td>300741.SZ</td></tr>
    </tbody>
  </table>
</div>
</main>
<footer class="version-note">StockWatcher 0.7.0-alpha.3 · 模拟预览</footer>
</body>
</html>
