main:
  "crontab: 25 8 * * 1-5":
    - name: StockWatcher Web 交易日预览
      runner:
        cpus: 2
      docker:
        build:
          dockerfile: deploy/cnb/Dockerfile
          by:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
          versionBy:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
      services:
        - name: vscode
          options:
            onlyPreview: true
            launch: bash deploy/cnb/run-preview.sh
            daemon: true
            keepAliveTimeout: 8h
            backup: true
        - docker
      env:
        STOCKWATCHER_CNB_END_TIME: "16:15"
        STOCKWATCHER_CNB_BACKUP_TIMES: "11:35,15:55,16:10"
        STOCKWATCHER_CNB_BACKUP_INTERVAL_SECONDS: "900"
      stages:
        - name: 确认 Web 预览服务已声明
          script: echo "CNB only-preview service attached"

$:
  web_trigger_cnb_preview:
    - name: StockWatcher Web 手动预览
      runner:
        cpus: 2
      docker:
        build:
          dockerfile: deploy/cnb/Dockerfile
          by:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
          versionBy:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
      services:
        - name: vscode
          options:
            onlyPreview: true
            launch: bash deploy/cnb/run-preview.sh
            daemon: true
            keepAliveTimeout: 3h
            backup: true
        - docker
      env:
        STOCKWATCHER_CNB_MANUAL_DURATION_MINUTES: "120"
        STOCKWATCHER_CNB_BACKUP_INTERVAL_SECONDS: "60"
      stages:
        - name: 确认 Web 预览服务已声明
          script: echo "CNB manual only-preview service attached"

  web_trigger_cnb_setup:
    - name: StockWatcher Web 首次设置
      runner:
        cpus: 2
      docker:
        build:
          dockerfile: deploy/cnb/Dockerfile
          by:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
          versionBy:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
      services:
        - name: vscode
          options:
            backup: true
        - docker
      stages:
        - name: 输出首次设置入口
          script: echo "Run bash deploy/cnb/bootstrap-admin.sh in the private terminal"

  vscode:
    - name: StockWatcher Web 运维空间
      runner:
        cpus: 2
      docker:
        build:
          dockerfile: deploy/cnb/Dockerfile
          by:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
          versionBy:
            - pyproject.toml
            - uv.lock
            - README.md
            - src
            - deploy/cnb/Dockerfile
      services:
        - name: vscode
          options:
            backup: true
        - docker
      stages:
        - name: 输出运维入口
          script: echo "StockWatcher Web operations workspace attached"
